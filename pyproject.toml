[project]
name = "sp100-graph-forecasting"
version = "0.1.0"
description = "Geometric Deep Learning for weekly stock movement prediction on the S&P100"
readme = "README.md"
authors = [
    { name = "Javirios03", email = "javier.riosmontes@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=6.7.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "tensorboard>=2.20.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "black",
    "ruff",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
    "torchaudio",
]
cu124 = [
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"